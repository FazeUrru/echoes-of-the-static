<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 viewBox="0 0 512 512" xml:space="preserve">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1"/>
    <stop offset="100%" style="stop-color:#000000;stop-opacity:1"/>
  </radialGradient>
  <radialGradient id="pulseGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0.6"/>
    <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:0"/>
  </radialGradient>
</defs>

<!-- Background -->
<rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>

<!-- Pulse ring -->
<circle cx="256" cy="256" r="140" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.3"/>
<circle cx="256" cy="256" r="100" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.2"/>
<circle cx="256" cy="256" r="180" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.15"/>

<!-- Pulse glow -->
<circle cx="256" cy="256" r="80" fill="url(#pulseGrad)" opacity="0.4"/>

<!-- E (Echo) letter -->
<text x="256" y="280" font-family="monospace" font-size="160" font-weight="bold" fill="#00e5ff" text-anchor="middle" dominant-baseline="middle"
  style="filter: drop-shadow(0 0 20px rgba(0,229,255,0.5)) drop-shadow(0 0 40px rgba(0,229,255,0.3));">E</text>

<!-- Sound wave lines -->
<path d="M 120 256 Q 140 220 160 256" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.4"/>
<path d="M 100 256 Q 130 200 160 256" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.25"/>

<path d="M 352 256 Q 372 220 392 256" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.4"/>
<path d="M 352 256 Q 382 200 412 256" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.25"/>
</svg>
